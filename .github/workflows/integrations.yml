name: Validate integrations

on:
  push:
    branches: [main]
    paths:
      - 'integrations/**'
      - '.github/workflows/integrations.yml'
  pull_request:
    paths:
      - 'integrations/**'
      - '.github/workflows/integrations.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r integrations/requirements-dev.txt
      - run: python integrations/scripts/validate.py
      - run: python -m unittest discover -s integrations/tests
